# ---------- Base de dados PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/ajsv_bolsas
spring.datasource.username=postgres
spring.datasource.password= JosemarSv

# "create" recria as tabelas e volta a carregar o data.sql sempre que o backend arranca.
# Depois da apresentação, se quiseres guardar os dados, muda para "update"
# e muda spring.sql.init.mode para "never".
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.open-in-view=false

# Mostra as mensagens de erro dos controllers no frontend
server.error.include-message=always
server.port=8080
